services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: .
    restart: unless-stopped
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./src:/app/src:ro
    env_file: .env
    environment:
      DATABASE_URL: postgres://assistant:assistant@db:5432/assistant
      DATABASE_SSL: "false"
      HOST: "0.0.0.0"
    ports:
      - "127.0.0.1:${SERVER_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
